[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdrive-organizer"
version = "0.1.0"
description = "Governance-aware enterprise knowledge retrieval platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.28.0",
  "google-auth>=2.37.0",
  "google-auth-oauthlib>=1.2.0",
  "google-api-python-client>=2.154.0",
  "pgvector>=0.3.6",
  "redis>=5.2.0",
  "structlog>=24.4.0",
  "python-multipart>=0.0.17",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/kip_core/src/kip_core", "apps/api/src/kip_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kip_core", "kip_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/kip_core/src", "apps/api/src"]
